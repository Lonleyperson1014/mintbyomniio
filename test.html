<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Trade Bulk Positions Test</title>
  <!-- Load Supabase JS CDN -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
</head>
<body>
  <h1>Trade Bulk Positions</h1>
  <div id="results"></div>

  <script>
    const SUPABASE_URL = 'https://kgwwuwqtxqlpmdsyxfci.supabase.co';
    const SUPABASE_ANON_KEY = 'sb_publishable_mQicwHup1pa2UAJLy9X0cA_VJy_nZEV';

    const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

    async function fetchTradeBulkPositions() {
      const { data, error } = await supabase
        .from('trade_bulk_pos')
        .select('*')
        .order('id', { ascending: false });

      if (error) {
        console.error('Error fetching records:', error);
        return;
      }

      console.log('Fetched positions:', data);
      document.getElementById('results').innerHTML = JSON.stringify(data, null, 2);
    }

    fetchTradeBulkPositions();
  </script>
</body>
</html>
