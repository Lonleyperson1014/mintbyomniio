<button id="generate-btn" style="background:#3b82f6; color:#fff; padding:10px 16px; border:none; border-radius:6px; cursor:pointer; margin-bottom:10px;">
  Generate Live Token
</button>
<input type="text" id="token-output" readonly placeholder="Generated token will appear here" style="width:100%; padding:8px; background:#1e293b; color:#fff; border:1px solid #334155; border-radius:4px;" />

<script>
  document.getElementById('generate-btn').addEventListener('click', async () => {
    try {
      const response = await fetch('/api/token/generate', { method: 'POST' });
      const data = await response.json();
      if (data.token) {
        document.getElementById('token-output').value = data.token;
      } else {
        alert('Error: ' + (data.error || 'Could not generate token'));
      }
    } catch (err) {
      alert('Network error connecting to function.');
    }
  });
</script>
